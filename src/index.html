<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ALLA CHECK — ALLA SERVICE</title>

    <!-- identidade AMOLED: evita "flash" branco e barra clara no celular -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- fonte do app: fonte do sistema (nativa de cada aparelho), sem depender
         de servidor externo. Antes usávamos Oswald/JetBrains Mono do Google
         Fonts, mas em conexões instáveis ou bloqueadas o carregamento falhava
         silenciosamente e o app abria com fontes diferentes a cada visita. -->

    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        background: #000000;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
      /* controles de formulario e SVG nao herdam fonte por padrao no navegador:
         sem isto o navegador usaria Arial/Times, variando por dispositivo.
         Elementos com fonte definida no proprio componente continuam mandando. */
      input,
      textarea,
      select,
      button,
      svg text {
        font-family: inherit;
      }
      /* resposta imediata ao toque no Android (sem atraso de 300ms) */
      button, a, [role="button"] {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      /* transição de entrada das telas: suave, rápida, sem flash */
      @keyframes allaEntradaTela {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .alla-tela {
        animation: allaEntradaTela 200ms cubic-bezier(.4, 0, .2, 1);
        will-change: opacity, transform;
      }
      /* respeita quem prefere menos animação no sistema */
      @media (prefers-reduced-motion: reduce) {
        .alla-tela { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
